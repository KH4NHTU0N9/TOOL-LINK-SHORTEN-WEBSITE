version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: url_shortener_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  redis:
    image: redis:7.0-alpine
    container_name: url_shortener_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: always

volumes:
  mongo_data:
  redis_data:
